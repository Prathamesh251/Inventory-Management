include:
  - path: ./frappe_docker/pwd.yml

services:
  lit-frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api-proxy
    networks:
      - frappe_network

  api-proxy:
    build:
      context: ./api-proxy
    ports:
      - "3000:3000"
    environment:
      - ERPNEXT_URL=http://backend:8000
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET}
    networks:
      - frappe_network

  db:
    image: mariadb:11.8
    ports:
      - "127.0.0.1:3307:3306"
